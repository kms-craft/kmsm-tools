<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메이플스토리M 심볼 계산기</title>
<style>
    :root {
        --bg: #f0f4f8;
        --panel: #ffffff;
        --primary: #5c6bc0;
        --primary-light: #8c9eff;
        --secondary: #00bcd4;
        --primary-grad: linear-gradient(135deg, #7e57c2, #4dd0e1);
        --ink: #1a237e;
        --muted: #7986cb;
        --line: #c5cae9;
        --highlight: #00acc1;
        --arcane: #7e57c2;
        --elyn: #00acc1;
        --grandis: #ab47bc;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; }
    
    body { 
        margin: 0; 
        padding: 20px; 
        background: radial-gradient(circle at 10% 0%,#e3f2fd 0,transparent 34%),linear-gradient(145deg,var(--bg),#e1f5fe); 
        color: var(--ink); 
    }
    .container { width: 100%; max-width: 1900px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { margin: 0; color: var(--ink); font-size: 26px; font-weight: 800; }
    
    .control-panel {
        background: #ffffffde; 
        padding: 14px 20px; 
        border-radius: 12px; 
        border: 1px solid var(--line);
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 15px;
        box-shadow: 0 4px 16px rgba(92, 107, 192, 0.06); 
        flex-wrap: wrap; 
        gap: 10px;
    }
    
    .section-title {
        font-size: 16px; font-weight: 800; padding: 8px 16px; color: white; 
        border-radius: 8px; display: inline-block; margin-right: 15px;
    }
    .title-arcane { background: linear-gradient(135deg, #7e57c2, #5c6bc0); box-shadow: 0 4px 12px rgba(126,87,194,0.2); }
    .title-auth { background: linear-gradient(135deg, #3f51b5, #00acc1); box-shadow: 0 4px 12px rgba(0,172,193,0.2); }
    
    .status-text { font-size: 14px; font-weight: 800; color: var(--highlight); background: #e8eaf6; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); }

    select { 
        padding: 8px; 
        border-radius: 6px; 
        border: 1px solid var(--line); 
        outline: none; 
        font-weight: 700; 
        cursor: pointer; 
        font-size: 14px; 
        background: #fff; 
        color: var(--ink);
        transition: 0.2s;
    }
    select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(92,107,192,0.2); }
    
    /* 가로 스크롤 컨테이너 */
    .row-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; margin-bottom: 15px; }
    .row-scroll::-webkit-scrollbar { height: 10px; }
    .row-scroll::-webkit-scrollbar-track { background: #e8eaf6; border-radius: 5px; }
    .row-scroll::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 5px; }
    .row-scroll::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* 카드 디자인 */
    .card {
        background: #ffffffde; 
        border: 1px solid var(--line); 
        border-radius: 12px; 
        padding: 16px; 
        min-width: 250px; 
        flex: 1 0 auto; 
        width: calc((100% - 75px) / 6); 
        box-shadow: 0 4px 12px rgba(92, 107, 192, 0.06); 
        display: flex; 
        flex-direction: column;
        transition: 0.2s;
    }
    .card:hover { border-color: var(--primary-light); }
    
    /* 미출시 더미 카드 */
    .dummy-card {
        background: rgba(255,255,255,0.4); 
        border: 2px dashed var(--line); 
        box-shadow: none;
        display: flex; 
        align-items: center; 
        justify-content: center;
        color: var(--muted); 
        font-weight: 700; 
        font-size: 14px; 
    }

    /* 미개방 지역 비활성화 UI */
    .disabled-card { opacity: 0.4; pointer-events: none; filter: grayscale(100%); background: #f1f2f6; }

    .card h3 { margin: 0 0 14px 0; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .arcane-card h3 { color: var(--primary); border-bottom: 2px solid #e8eaf6; padding-bottom: 10px; font-weight: 800; }
    .elyn-card h3 { color: var(--secondary); border-bottom: 2px solid #e0f7fa; padding-bottom: 10px; font-weight: 800; }
    .grandis-card h3 { color: #7e57c2; border-bottom: 2px solid #ede7f6; padding-bottom: 10px; font-weight: 800; }

    .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .input-group label { color: var(--primary); font-weight: 750; }
    .input-group input { 
        width: 80px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; 
        text-align: right; font-size: 14px; outline: none; background: #fff; color: var(--ink); font-weight: bold;
        transition: 0.2s;
    }
    .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(92,107,192,0.2); background: #fff; }
    
    .result-box { margin-top: auto; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .arcane-card .result-box { background: #f8fbff; border: 1px dashed var(--primary-light); }
    .elyn-card .result-box { background: #e0f7fa55; border: 1px dashed var(--secondary); }
    .grandis-card .result-box { background: #f3e5f555; border: 1px dashed #ce93d8; }

    .result-box strong { color: var(--ink); font-size: 14px; }
    .highlight-date { font-weight: 800; color: var(--highlight); }
    .meso-text { color: #d32f2f; font-weight: 800; }
    .alloc-text { color: var(--secondary); font-weight: 800; font-size: 15px;}
    
    .badge { font-size: 12px; padding: 4px 8px; border-radius: 6px; color: white; font-weight: 800; }
    .badge.elyn { background: var(--secondary); }
    .badge.grandis { background: #7e57c2; }

    .sub-title { font-size: 14px; font-weight: 800; color: var(--primary); margin: 10px 0 5px 5px; }

    #init-msg { text-align: center; font-size: 18px; font-weight: bold; color: var(--primary); margin-top: 50px; }
    #error-log { color: white; background: #d63031; font-weight: bold; text-align: center; padding: 10px; display: none; border-radius: 8px; margin-top: 20px;}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>메이플스토리M 심볼 계산기</h1>
    </div>

    <div id="init-msg">계산기를 불러오는 중입니다... 화면이 변하지 않으면 새로고침 해주세요.</div>

    <div id="main-content" style="display: none;">
        <!-- 1. 아케인 심볼 -->
        <div class="control-panel">
            <div><div class="section-title title-arcane">🔮 아케인 심볼 (Max Lv.20)</div></div>
            <div class="status-text">일일 획득 총량 : 180개 (고정)</div>
        </div>
        <div class="row-scroll" id="arcane-grid"></div>

        <!-- 2. 어센틱 심볼 컨트롤 패널 -->
        <div class="control-panel">
            <div>
                <div class="section-title title-auth">✨ 어센틱 심볼 (Max Lv.11)</div>
                <select id="region-select">
                    <option value="250">Lv.250 에세테라 개방 (일일 40개)</option>
                    <option value="255">Lv.255 세르니움 개방 (일일 60개)</option>
                    <option value="260">Lv.260 아르크스 개방 (일일 80개)</option>
                    <option value="275">Lv.275 아에르 개방 (일일 100개)</option>
                    <option value="277">Lv.277 오디움 개방 (일일 120개)</option>
                    <option value="280">Lv.280 도원경 개방 (일일 140개)</option>
                    <option value="282" selected>Lv.282 아르테리아 개방 (일일 160개)</option>
                </select>
            </div>
            <div class="status-text" id="auth-pool-text">일일 획득 총량 : 160개</div>
        </div>

        <!-- 2-1. 어센틱: 에일린 (2종 + 4더미 = 6칸) -->
        <div class="sub-title">🌿 에일린 지역 (추후 4종 추가 예정)</div>
        <div class="row-scroll" id="elyn-grid"></div>

        <!-- 2-2. 어센틱: 그란디스 (5종 + 1더미 = 6칸) -->
        <div class="sub-title">☀️ 그란디스 지역 (5종 완성)</div>
        <div class="row-scroll" id="grandis-grid"></div>
    </div>
    
    <div id="error-log"></div>
</div>

<script>
(function() {
    try {
        // [1] 데이터 정의
        var arcReq = [0, 15, 19, 24, 31, 40, 50, 62, 77, 96, 120, 156, 202, 262, 340, 442, 574, 746, 1007, 1359];
        var arcMesoVJ = [0, 13000000, 15600000, 18720000, 22464000, 26956800, 33696000, 42120000, 54756000, 71182800, 92537640, 112433233, 147568618, 193525702, 262967277, 382497857, 518762719, 702839813, 951176547, 1226033769];
        var arcMesoOther = [0, 13000000, 17160000, 20592000, 24710400, 29652480, 37065600, 46332000, 60231600, 78301080, 101791404, 123676740, 162325625, 212878930, 289264718, 420748240, 570639630, 773124000, 1046294480, 1348637290];

        function makeCum(arr) {
            var cum = [0], sum = 0;
            for(var i=1; i<arr.length; i++) { sum += arr[i]; cum.push(sum); }
            return cum;
        }
        var arcCumReq = makeCum(arcReq);
        var arcCumMesoVJ = makeCum(arcMesoVJ);
        var arcCumMesoOther = makeCum(arcMesoOther);

        var authReq = [0], authBaseMeso = [0, 8500000, 30000000, 73500000, 148000000, 262500000, 426000000, 647500000, 936000000, 1300500000, 1750000000];
        for(var n=1; n<=10; n++) authReq.push(10 * n * n + 3 * n);
        var authCumReq = makeCum(authReq);

        function getAuthCumMeso(k) {
            var arr = [0], sum = 0;
            for(var x=1; x<=10; x++) { sum += authBaseMeso[x] + (k * 100000 * Math.pow(x, 3)); arr.push(sum); }
            return arr;
        }

        // [2] 심볼 메타 데이터 (카르시온 제거, 아르테리아까지 5종)
        var symbols = [
            // 아케인 6종
            { id: 'arc1', type: 'arcane', name: '소멸의 여로', isVJ: true },
            { id: 'arc2', type: 'arcane', name: '츄츄 아일랜드', isVJ: false },
            { id: 'arc3', type: 'arcane', name: '레헬른', isVJ: false },
            { id: 'arc4', type: 'arcane', name: '아르카나', isVJ: false },
            { id: 'arc5', type: 'arcane', name: '모라스', isVJ: false },
            { id: 'arc6', type: 'arcane', name: '에스페라', isVJ: false },
            
            // 어센틱 - 에일린 2종
            { id: 'authE1', type: 'elyn', name: '에세테라', k: 0, label: '에일린', unlockLvl: 250 },
            { id: 'authE2', type: 'elyn', name: '아에르', k: 2, label: '에일린', unlockLvl: 275 },
            
            // 어센틱 - 그란디스 5종 (카르시온 제외)[cite: 5]
            { id: 'authG1', type: 'grandis', name: '세르니움', k: 1, label: '그란디스', unlockLvl: 255 },
            { id: 'authG2', type: 'grandis', name: '아르크스', k: 3, label: '그란디스', unlockLvl: 260 },
            { id: 'authG3', type: 'grandis', name: '오디움', k: 4, label: '그란디스', unlockLvl: 277 },
            { id: 'authG4', type: 'grandis', name: '도원경', k: 5, label: '그란디스', unlockLvl: 280 },
            { id: 'authG5', type: 'grandis', name: '아르테리아', k: 6, label: '그란디스', unlockLvl: 282 }
        ];

        function getAuthenticDailyPool(level) {
            if(level == 250) return 40;
            if(level == 255) return 60;
            if(level == 260) return 80;
            if(level == 275) return 100;
            if(level == 277) return 120;
            if(level == 280) return 140;
            if(level == 282) return 160;
            return 40; 
        }

        // [3] 유틸리티
        function formatMeso(num) {
            if(num <= 0) return "0 메소";
            var eok = Math.floor(num / 100000000);
            var man = Math.floor((num % 100000000) / 10000);
            var txt = "";
            if(eok > 0) txt += eok + "억 ";
            if(man > 0) txt += man + "만 ";
            return txt.trim() + " 메소";
        }

        function addDays(days) {
            var d = new Date(); 
            d.setDate(d.getDate() + days);
            var m = d.getMonth() + 1;
            var day = d.getDate();
            return "(" + d.getFullYear() + "." + (m < 10 ? '0'+m : m) + "." + (day < 10 ? '0'+day : day) + ")";
        }

        // [4] 균등 분배 알고리즘
        function distributePool(cards, totalPool) {
            var active = [];
            for(var i=0; i<cards.length; i++) {
                if(cards[i].req > 0) {
                    cards[i].alloc = 1; 
                    active.push(cards[i]);
                } else {
                    cards[i].alloc = 0; 
                }
            }

            var pool = totalPool - active.length; 
            while(pool > 0 && active.length > 0) {
                var maxDays = -1;
                var targetIdx = -1;
                for(var j=0; j<active.length; j++) {
                    var days = active[j].req / active[j].alloc;
                    if(days > maxDays) {
                        maxDays = days;
                        targetIdx = j;
                    }
                }
                active[targetIdx].alloc++;
                pool--;
            }
        }

        // [5] 통합 계산
        function recalculateAll() {
            var arcCards = [];
            var authCards = [];
            var currentAuthLevel = parseInt(document.getElementById('region-select').value) || 282;
            
            var authDailyPool = getAuthenticDailyPool(currentAuthLevel);
            document.getElementById('auth-pool-text').innerHTML = "일일 획득 총량 : " + authDailyPool + "개";

            for(var i=0; i<symbols.length; i++) {
                var sym = symbols[i];
                var maxLv = (sym.type === 'arcane') ? 20 : 11;
                
                var el_card = document.getElementById(sym.id + '_card');
                var lv = Math.min(Math.max(parseInt(document.getElementById(sym.id + '_lv').value) || 1, 1), maxLv);
                var cur = parseInt(document.getElementById(sym.id + '_cur').value) || 0;
                var tg = Math.min(Math.max(parseInt(document.getElementById(sym.id + '_tg').value) || maxLv, lv), maxLv);
                
                var cumReqArr = (sym.type === 'arcane') ? arcCumReq : authCumReq;
                var cumMesoArr = (sym.type === 'arcane') ? (sym.isVJ ? arcCumMesoVJ : arcCumMesoOther) : getAuthCumMeso(sym.k);
                
                var absCur = cumReqArr[lv - 1] + cur;
                var reqSym = cumReqArr[tg - 1] - absCur;
                if(reqSym < 0) reqSym = 0;
                
                var reqMesos = cumMesoArr[tg - 1] - cumMesoArr[lv - 1];
                if(reqMesos < 0) reqMesos = 0;

                var data = { 
                    sym: sym, req: reqSym, meso: reqMesos, alloc: 0, 
                    isFinished: (lv >= tg || absCur >= cumReqArr[tg - 1]),
                    isDisabled: false
                };

                if(sym.type !== 'arcane') {
                    if(sym.unlockLvl > currentAuthLevel) {
                        data.isDisabled = true;
                        data.req = 0;
                        if(el_card) el_card.className = "card " + sym.type + "-card disabled-card";
                    } else {
                        if(el_card) el_card.className = "card " + sym.type + "-card";
                    }
                    authCards.push(data);
                } else {
                    arcCards.push(data);
                }
            }

            distributePool(arcCards, 180); 
            distributePool(authCards, authDailyPool); 

            var allCards = arcCards.concat(authCards);
            for(var k=0; k<allCards.length; k++) {
                var c = allCards[k];
                var resBox = document.getElementById(c.sym.id + '_resTarget');
                if(!resBox) continue;

                if (c.isDisabled) {
                    resBox.innerHTML = "🔒 <strong>해당 지역 미개방</strong><br>상단의 최고 지역 레벨을 확인하세요.";
                } else if (c.isFinished) {
                    resBox.innerHTML = "✅ <strong>이미 목표 레벨을 달성했습니다.</strong><br><span style='color:transparent'>.</span><br><span style='color:transparent'>.</span><br><span style='color:transparent'>.</span>";
                } else {
                    var days = Math.ceil(c.req / c.alloc);
                    var html = "";
                    html += "일일 할당량: <span class='alloc-text'>" + c.alloc + "개</span><br>";
                    html += "남은 심볼: <strong>" + c.req.toLocaleString() + "개</strong><br>";
                    html += "필요 비용: <span class='meso-text'>" + formatMeso(c.meso) + "</span><br>";
                    html += "소요 기간: <strong>" + days + "일</strong> <span class='highlight-date'>" + addDays(days) + "</span>";
                    resBox.innerHTML = html;
                }
            }
        }

        // [6] HTML 뼈대 생성 및 삽입 (지역별 분리)
        var arcaneHtml = "";
        var elynHtml = "";
        var grandisHtml = "";

        for(var i=0; i<symbols.length; i++) {
            var sym = symbols[i];
            var maxLv = (sym.type === 'arcane') ? 20 : 11;
            var badgeHtml = sym.label ? "<span class='badge " + sym.type + "'>" + sym.label + "</span>" : "";
            
            var html = "";
            html += "<div class='card " + sym.type + "-card' id='" + sym.id + "_card'>";
            html += "  <h3>" + sym.name + " " + badgeHtml + "</h3>";
            html += "  <div class='input-group'><label>현재 레벨</label><input type='number' id='" + sym.id + "_lv' min='1' max='" + maxLv + "' value='1' onfocus=\"if(this.value==='1') this.value='';\" onblur=\"if(this.value==='') this.value='1'; recalculateAll();\"></div>";
            html += "  <div class='input-group'><label>보유량(개)</label><input type='number' id='" + sym.id + "_cur' min='0' value='0' onfocus=\"if(this.value==='0') this.value='';\" onblur=\"if(this.value==='') this.value='0'; recalculateAll();\"></div>";
            html += "  <div class='input-group'><label>목표 레벨</label><input type='number' id='" + sym.id + "_tg' min='2' max='" + maxLv + "' value='" + maxLv + "' onfocus=\"if(this.value==='" + maxLv + "') this.value='';\" onblur=\"if(this.value==='') this.value='" + maxLv + "'; recalculateAll();\"></div>";
            html += "  <div class='result-box' id='" + sym.id + "_resTarget' style='margin-top:10px;'></div>";
            html += "</div>";

            if(sym.type === 'arcane') {
                arcaneHtml += html;
            } else if(sym.type === 'elyn') {
                elynHtml += html;
            } else if(sym.type === 'grandis') {
                grandisHtml += html;
            }
        }

        // 에일린 지역은 현재 2개이므로 4개의 더미 카드 추가 (6칸 규격 맞춤)
        for(var d=1; d<=4; d++) {
            elynHtml += "<div class='card dummy-card'>미출시 지역 " + d + "</div>";
        }

        // 그란디스 지역은 현재 5개이므로 1개의 더미 카드 추가 (6칸 규격 맞춤)[cite: 5]
        for(var d=1; d<=1; d++) {
            grandisHtml += "<div class='card dummy-card'>미출시 지역 1</div>";
        }

        document.getElementById('arcane-grid').innerHTML = arcaneHtml;
        document.getElementById('elyn-grid').innerHTML = elynHtml;
        document.getElementById('grandis-grid').innerHTML = grandisHtml;

        // [7] 이벤트 연동
        document.getElementById('region-select').addEventListener('change', recalculateAll);

        for(var j=0; j<symbols.length; j++) {
            var fields = ['lv', 'cur', 'tg'];
            for(var f=0; f<fields.length; f++) {
                var el = document.getElementById(symbols[j].id + '_' + fields[f]);
                if(el) { el.addEventListener('input', recalculateAll); }
            }
        }

        // 준비 완료
        document.getElementById('init-msg').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';

        recalculateAll();

    } catch(e) {
        var errBox = document.getElementById('error-log');
        errBox.style.display = 'block';
        errBox.innerHTML = "오류 내용: " + e.message;
        document.getElementById('init-msg').style.display = 'none';
    }
})();
</script>
</body>
</html>
